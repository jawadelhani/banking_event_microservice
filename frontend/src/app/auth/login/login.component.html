<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <img src="assets/al-barid-logo.png" alt="Al Barid Bank" class="logo" />
      <h1>Welcome back</h1>
      <p>Sign in to your Al Barid Bank account</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" type="text" class="form-control" formControlName="username" placeholder="Enter username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" class="form-control" formControlName="password" placeholder="Enter password" />
      </div>

      <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
